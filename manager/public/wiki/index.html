<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Camp Wiki &amp; Codex — คัมภีร์ฐานข้อมูล Night Camp SS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script>
(function () {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const apply = () => {
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.dataset.theme = t === 'system' ? (mq.matches ? 'dark' : 'light') : t;
    document.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  };
  window.setTheme = (t) => { localStorage.setItem('theme', t); apply(); };
  mq.addEventListener('change', apply);
  apply();
  document.addEventListener('DOMContentLoaded', apply);
})();
</script>
<style>
:root {
  --bg: #070b14;
  --bg-grad: radial-gradient(circle at 16% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 42%),
             radial-gradient(circle at 84% 8%, rgba(139, 92, 246, 0.12) 0%, transparent 46%),
             radial-gradient(circle at 50% 100%, rgba(245, 158, 11, 0.07) 0%, transparent 50%),
             #070b14;
  --card: rgba(15, 23, 42, 0.82);
  --card-hover: rgba(20, 30, 55, 0.94);
  --ink: #f1f5f9;
  --mut: #94a3b8;
  --line: rgba(148, 163, 184, 0.16);
  --line-strong: rgba(56, 189, 248, 0.38);
  --acc: #38bdf8;
  --acc-2: #8b5cf6;
  --gold: #f59e0b;
  --ok: #10b981;
  --field: rgba(9, 14, 26, 0.88);
  --hit: rgba(245, 158, 11, 0.18);
  --head: rgba(10, 15, 29, 0.88);
  --good: #34d399;
  --bad: #f87171;
  --shadow-card: 0 10px 28px -6px rgba(0, 0, 0, 0.55);
  --shadow-hover: 0 18px 40px -8px rgba(14, 165, 233, 0.24);
  --spring: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: dark;
}
:root[data-theme=light] {
  --bg: #f1f5f9;
  --bg-grad: radial-gradient(circle at 16% 0%, rgba(14, 165, 233, 0.10) 0%, transparent 45%),
             radial-gradient(circle at 84% 8%, rgba(139, 92, 246, 0.08) 0%, transparent 45%),
             #f1f5f9;
  --card: rgba(255, 255, 255, 0.92);
  --card-hover: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: rgba(100, 116, 139, 0.20);
  --line-strong: rgba(2, 132, 199, 0.45);
  --acc: #0284c7;
  --acc-2: #6d28d9;
  --gold: #d97706;
  --ok: #059669;
  --field: #f8fafc;
  --hit: #fef3c7;
  --head: rgba(255, 255, 255, 0.92);
  --good: #059669;
  --bad: #dc2626;
  --shadow-card: 0 8px 24px -6px rgba(15, 23, 42, 0.08);
  --shadow-hover: 0 16px 36px -8px rgba(2, 132, 199, 0.18);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100vh;
  font: 13.5px/1.5 'Plus Jakarta Sans', 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--ink);
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.25); }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.28); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.55); }

/* Ambient floating lantern particles */
.bg-orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.45;
  animation: orbFloat 16s ease-in-out infinite alternate;
}
.bg-orb.o1 { width: 360px; height: 360px; top: -110px; left: -80px; background: rgba(56, 189, 248, 0.18); }
.bg-orb.o2 { width: 420px; height: 420px; top: 20%; right: -140px; background: rgba(139, 92, 246, 0.16); animation-delay: -5s; }
.bg-orb.o3 { width: 320px; height: 320px; bottom: -100px; left: 28%; background: rgba(245, 158, 11, 0.12); animation-delay: -9s; }
@keyframes orbFloat {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  100% { transform: translate3d(24px, -28px, 0) scale(1.08); }
}

/* Header & Navigation */
header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--head);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
}
.head-top {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-right: 4px;
}
.brand-badge {
  width: 36px;
  height: 36px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(139, 92, 246, 0.28));
  border: 1px solid rgba(56, 189, 248, 0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  box-shadow: 0 6px 18px rgba(14, 165, 233, 0.22);
}
.brand-title {
  display: flex;
  flex-direction: column;
}
.brand-title h1 {
  font-size: 16.5px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
  background: linear-gradient(90deg, #38bdf8, #a78bfa, #fbbf24);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-title small {
  font-size: 11px;
  color: var(--mut);
  font-weight: 500;
  margin-top: -2px;
}

.search-wrap {
  flex: 1;
  min-width: 240px;
  position: relative;
  display: flex;
  align-items: center;
}
.search-ic {
  position: absolute;
  left: 12px;
  color: var(--mut);
  font-size: 14px;
  pointer-events: none;
}
#q {
  width: 100%;
  padding: 9px 74px 9px 36px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ink);
  font: inherit;
  font-size: 13.5px;
  transition: border-color 0.2s var(--spring), box-shadow 0.2s var(--spring), transform 0.18s var(--spring);
}
#q:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
}
.search-kbd {
  position: absolute;
  right: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  padding: 2px 6px;
  border-radius: 5px;
  background: rgba(148, 163, 184, 0.14);
  border: 1px solid var(--line);
  color: var(--mut);
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 54px;
  border: 0;
  background: rgba(148, 163, 184, 0.18);
  color: var(--ink);
  width: 20px;
  height: 20px;
  border-radius: 50%;
  font-size: 11px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
}
.search-clear.show { display: inline-flex; }

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  background: var(--field);
  border-radius: 10px;
  padding: 2px;
  gap: 2px;
}
.seg button {
  background: transparent;
  border: 0;
  color: var(--mut);
  padding: 5px 10px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.18s var(--spring), color 0.18s var(--spring), transform 0.12s var(--spring);
}
.seg button:hover { color: var(--ink); }
.seg button:active { transform: scale(0.95); }
.seg button.on {
  background: linear-gradient(135deg, #0284c7, #6366f1);
  color: #fff;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
}

/* Main Category Tabs */
.tabs-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.tabs {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  border: 0;
  background: transparent;
  padding: 0;
}
.tabs button {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 7px 13px;
  font-weight: 700;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mut);
  cursor: pointer;
  transition: transform 0.18s var(--spring), border-color 0.18s var(--spring), background 0.18s var(--spring), color 0.18s var(--spring), box-shadow 0.18s var(--spring);
}
.tabs button:hover {
  transform: translateY(-2px);
  color: var(--ink);
  border-color: rgba(56, 189, 248, 0.42);
}
.tabs button:active { transform: scale(0.96); }
.tabs button.on {
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(139, 92, 246, 0.28));
  border-color: var(--acc);
  color: var(--ink);
  box-shadow: 0 6px 20px -4px rgba(56, 189, 248, 0.35);
}
.tab-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(148, 163, 184, 0.15);
  color: var(--mut);
  font-weight: 700;
}
.tabs button.on .tab-badge {
  background: var(--acc);
  color: #020617;
}
.tab-badge.hit- match {
  background: var(--gold);
  color: #020617;
}

/* Omni-Search Quick Jump Strip */
#omni-strip {
  display: none;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 7px 12px;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(56, 189, 248, 0.12), rgba(139, 92, 246, 0.12));
  border: 1px solid rgba(56, 189, 248, 0.32);
  font-size: 12px;
  animation: fadeSlideDown 0.22s var(--spring) forwards;
}
#omni-strip.show { display: flex; }
@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Breadcrumb History Bar */
#crumb-bar {
  display: none;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 6px 18px;
  background: rgba(14, 165, 233, 0.08);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
#crumb-bar.show { display: flex; }
.crumb-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 7px;
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--ink);
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  transition: transform 0.15s var(--spring), border-color 0.15s ease;
}
.crumb-item:hover {
  transform: translateY(-1px);
  border-color: var(--acc);
}

.meta-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  color: var(--mut);
  font-size: 12px;
  padding: 8px 18px 0;
}

/* Layout Grid */
.wrap {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 310px 1fr;
  gap: 16px;
  padding: 12px 18px 28px;
  align-items: start;
}
aside {
  position: sticky;
  top: 116px;
  max-height: calc(100vh - 132px);
  overflow: auto;
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  box-shadow: var(--shadow-card);
}
aside h3 {
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--acc);
  margin: 14px 0 7px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
aside h3:first-child { margin-top: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  border: 1px solid var(--line);
  background: var(--field);
  border-radius: 999px;
  padding: 4px 10px;
  font: inherit;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  transition: transform 0.15s var(--spring), border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.chip:hover {
  border-color: var(--acc);
  transform: translateY(-1px);
}
.chip:active { transform: scale(0.95); }
.chip.on {
  background: linear-gradient(135deg, #0284c7, #6366f1);
  border-color: var(--acc);
  color: #fff;
  box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
}
.chip small { opacity: 0.72; margin-left: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; }

select, input[type=number] {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font: inherit;
  font-size: 12.5px;
  background: var(--field);
  color: var(--ink);
}
select:focus, input[type=number]:focus {
  outline: none;
  border-color: var(--acc);
}
input[type=range] { width: 100%; accent-color: var(--acc); }
.row2 { display: flex; gap: 6px; align-items: center; }
.row2 input[type=number] { width: 88px; }
.mode { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--ink);
  border-radius: 8px;
  padding: 6px 11px;
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  transition: transform 0.15s var(--spring), border-color 0.15s ease, background 0.15s ease;
}
.btn:hover { border-color: var(--acc); transform: translateY(-1px); }
.btn:active { transform: scale(0.96); }

.bar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--line);
  padding: 9px 14px;
  border-radius: 12px;
}
.bar .count { font-weight: 800; font-size: 13.5px; color: var(--acc); }
.bar select { width: auto; }

/* Cards Grid & Staggered Cascade Animation */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(335px, 1fr));
  gap: 14px;
}
@keyframes cardCascadeIn {
  from { opacity: 0; transform: translate3d(0, 14px, 0) scale(0.985); }
  to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
}
.c {
  position: relative;
  background: var(--card);
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow-card);
  transition: transform 0.22s var(--spring), border-color 0.22s var(--spring), box-shadow 0.22s var(--spring), background 0.22s ease;
  animation: cardCascadeIn 0.32s var(--spring) both;
}
.c:nth-child(1) { animation-delay: 0.01s; }
.c:nth-child(2) { animation-delay: 0.03s; }
.c:nth-child(3) { animation-delay: 0.05s; }
.c:nth-child(4) { animation-delay: 0.07s; }
.c:nth-child(5) { animation-delay: 0.09s; }
.c:nth-child(6) { animation-delay: 0.11s; }
.c:nth-child(7) { animation-delay: 0.13s; }
.c:nth-child(8) { animation-delay: 0.15s; }
.c:hover {
  transform: translate3d(0, -3px, 0);
  background: var(--card-hover);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-hover);
}
.c.rar-rare { border-left: 3px solid #3b82f6; }
.c.rar-epic { border-left: 3px solid #a855f7; }
.c.rar-legend { border-left: 3px solid #f59e0b; box-shadow: 0 10px 28px -6px rgba(245, 158, 11, 0.18); }
.c.rar-boss { border-left: 3px solid #ef4444; box-shadow: 0 10px 28px -6px rgba(239, 68, 68, 0.2); }
.c.flash-highlight {
  animation: pulseHighlight 1.6s var(--spring);
}
@keyframes pulseHighlight {
  0%, 100% { box-shadow: var(--shadow-card); }
  30% { box-shadow: 0 0 0 3px #f59e0b, 0 0 36px rgba(245, 158, 11, 0.65); transform: scale(1.015); }
}

.top { display: flex; gap: 11px; align-items: center; }
.top img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, var(--field) 75%);
  border: 1px solid var(--line);
  border-radius: 12px;
  flex: none;
  padding: 3px;
  transition: transform 0.22s var(--spring);
}
.c:hover .top img { transform: scale(1.06); }
.ai {
  display: inline-block;
  flex: none;
  vertical-align: middle;
  background-color: var(--field);
  border-radius: 8px;
}
.top .ai { border-radius: 11px; border: 1px solid var(--line); }
.row-ic { display: flex; gap: 7px; align-items: center; }
.tiers .ai { margin-right: 4px; }
.top .n { font-weight: 800; font-size: 15px; line-height: 1.3; }
.s { font-size: 12px; color: var(--mut); }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  color: #fff;
  font-weight: 700;
  vertical-align: 1px;
  margin-right: 3px;
  margin-bottom: 2px;
}
.tag.o {
  background: rgba(148, 163, 184, 0.08);
  border: 1px solid var(--line);
  color: var(--mut);
}

/* Interactive Entity Pills (Hover to preview, Click to inspect/jump) */
.elink {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 8px;
  background: var(--field);
  border: 1px solid var(--line);
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  margin: 2px 3px 2px 0;
  transition: transform 0.16s var(--spring), border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
}
.elink:hover {
  transform: translateY(-2px);
  border-color: var(--acc);
  background: rgba(56, 189, 248, 0.14);
  box-shadow: 0 5px 14px rgba(14, 165, 233, 0.22);
}
.elink:active { transform: scale(0.96); }
.elink .rate {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: #fbbf24;
  font-weight: 700;
}
.elink.rar-rare { border-color: rgba(59, 130, 246, 0.48); }
.elink.rar-epic { border-color: rgba(168, 85, 247, 0.52); }
.elink.rar-legend { border-color: rgba(245, 158, 11, 0.65); background: rgba(245, 158, 11, 0.1); }

/* Monster Stats Mini-Grid */
.mstat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 7px 9px;
  font-size: 11.5px;
}
.mstat-cell {
  display: flex;
  flex-direction: column;
}
.mstat-cell small {
  font-size: 10px;
  color: var(--mut);
  text-transform: uppercase;
}
.mstat-cell b {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink);
}
.drop-sec {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
}
.drop-lbl {
  font-size: 11px;
  font-weight: 700;
  color: var(--mut);
  display: flex;
  align-items: center;
  gap: 4px;
}
.drop-pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
}

.pin-btn {
  margin-left: auto;
  border: 1px solid var(--line);
  background: var(--field);
  color: var(--mut);
  width: 30px;
  height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.16s var(--spring), color 0.16s ease, border-color 0.16s ease;
}
.pin-btn:hover { transform: scale(1.1); border-color: var(--gold); color: var(--gold); }
.pin-btn.on { color: #fbbf24; border-color: rgba(245, 158, 11, 0.6); background: rgba(245, 158, 11, 0.15); }

.art { font-weight: 700; }
.art span { font-weight: 400; color: var(--mut); font-size: 12px; }
.d { font-size: 12.8px; line-height: 1.48; }
.eff { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; }
.eff .b { flex: none; font-size: 10.5px; font-weight: 700; color: #fff; border-radius: 5px; padding: 1px 6px; margin-top: 1px; }
.eff .gap { color: var(--mut); font-size: 11px; }
.eff.hit { background: var(--hit); border-radius: 6px; padding: 2px 5px; margin: -2px -5px; }
.maps { font-size: 12px; color: var(--mut); }
.empty { padding: 48px 20px; text-align: center; color: var(--mut); grid-column: 1 / -1; background: var(--card); border: 1px dashed var(--line); border-radius: 16px; }
.gain { font-size: 21px; font-weight: 800; color: var(--good); font-family: 'JetBrains Mono', monospace; }
.gain.neg { color: var(--bad); }
.gain.na { font-size: 12.5px; font-weight: 600; color: var(--mut); font-family: inherit; }
.tiers { font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; }
.tiers b { color: var(--mut); }
.tiers .cur { color: var(--ink); font-weight: 700; }
details summary { cursor: pointer; font-size: 12px; color: var(--acc); font-weight: 700; user-select: none; }
.jl { font-size: 12px; margin: 5px 0 0; }
.jl b { color: var(--mut); font-weight: 600; }
table.rt { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
table.rt td, table.rt th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
table.rt th { color: var(--mut); font-weight: 700; font-size: 11px; text-transform: uppercase; }
table.rt td.num { text-align: right; white-space: nowrap; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.pos { color: var(--good); }
.negc { color: var(--bad); }
.calc {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 12px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  align-items: center;
  font-size: 12.5px;
  box-shadow: var(--shadow-card);
}
.calc label { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.calc input[type=number] { width: 64px; }
.help {
  font-size: 12px;
  color: var(--mut);
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 9px 14px;
  margin-bottom: 12px;
}
.best {
  font-size: 12.5px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 10px;
}
.best .gain { font-size: 15.5px; }
.rtip { cursor: pointer; border-bottom: 1px dotted var(--acc); }
.chip.blk { background: var(--bad); border-color: var(--bad); color: #fff; text-decoration: line-through; }
tr.blocked td { opacity: 0.45; }
tr.blocked .rtip { text-decoration: line-through; }
.bk { border: 0; background: transparent; cursor: pointer; padding: 0 3px; font-size: 12px; opacity: 0.75; }
.bk:hover { opacity: 1; }

/* Universal Floating Hover Preview Card (#tip) */
#tip {
  position: fixed;
  z-index: 200;
  max-width: 390px;
  min-width: 260px;
  background: rgba(11, 17, 32, 0.96);
  backdrop-filter: blur(16px);
  color: #f1f5f9;
  border: 1px solid rgba(56, 189, 248, 0.55);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 12px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 24px rgba(56, 189, 248, 0.2);
  pointer-events: none;
  display: none;
  animation: tipSpringIn 0.16s var(--spring) forwards;
}
@keyframes tipSpringIn {
  from { opacity: 0; transform: scale(0.95) translateY(4px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
#tip .h { display: flex; gap: 10px; align-items: center; font-weight: 800; font-size: 14px; margin-bottom: 6px; }
#tip .h img { width: 46px; height: 46px; object-fit: contain; background: rgba(15, 23, 42, 0.9); border-radius: 10px; border: 1px solid rgba(148, 163, 184, 0.2); padding: 2px; }
#tip .tiers { margin: 6px 0; }
#tip .tip-hint { margin-top: 6px; padding-top: 5px; border-top: 1px dashed rgba(148, 163, 184, 0.22); font-size: 10.5px; color: #38bdf8; font-weight: 600; }

/* Interactive Entity Inspector Modal (#inspector-backdrop) */
#inspector-backdrop {
  position: fixed;
  inset: 0;
  z-index: 150;
  background: rgba(3, 7, 18, 0.72);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
}
#inspector-backdrop.open { display: flex; }
#inspector-card {
  width: min(760px, 96vw);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--card-hover);
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  padding: 20px 22px;
  box-shadow: 0 28px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.18);
  animation: modalSpring 0.28s var(--spring) forwards;
}
@keyframes modalSpring {
  0% { opacity: 0; transform: scale(0.94) translateY(14px); }
  70% { opacity: 1; transform: scale(1.01) translateY(-2px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
.insp-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.insp-actions { display: flex; gap: 6px; align-items: center; }

@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

function ico(ic, size) {
  if (!ic) return `<i class="ai" style="width:${size}px;height:${size}px"></i>`;
  const [kind, i] = ic, m = D.meta.atlas[kind];
  if (!m) return `<i class="ai" style="width:${size}px;height:${size}px"></i>`;
  const k = size / m.cell, rows = Math.ceil(m.n / m.cols);
  const file = `${ATL}${kind === 'h128' ? 'hats128' : kind}.webp?v=${D.meta.atlasV}`;
  return `<i class="ai" style="width:${size}px;height:${size}px;background:url(${file}) -${(i % m.cols) * m.cell * k}px -${Math.floor(i / m.cols) * m.cell * k}px/${m.cols * m.cell * k}px ${rows * m.cell * k}px no-repeat"></i>`;
}

function pinBtnHtml(key) {
  const on = PINNED.has(key);
  return `<button type="button" class="pin-btn${on ? ' on' : ''}" data-pin="${esc(key)}" title="${on ? 'เอาออกจากรายการปักหมุด' : 'ปักหมุดรายการนี้'}">${on ? '⭐' : '☆'}</button>`;
}

const CALC0 = () => ({ tier: 3, n: 1, night: true, qb: 0, qd: 0, mode: 's2', near: true });
const fresh = () => ({
  q: '',
  // monsters
  mType: new Set(), mReg: '', mRace: '', mEl: '', mDrops: new Set(), mLvMin: '', mLvMax: '', sortM: 'lv',
  // cards
  keys: new Set(), mode: 'any', trig: new Set(), sub: '', type: new Set(), region: '', race: '', artEl: '', lvMin: '', lvMax: '', sortC: 'val',
  // runes
  rKind: new Set(), rOn: new Set(), rJob: '', sortR: 'gain',
  // skills
  sJob: '', sRune: '', sTy: new Set(), sortS: 'best',
  // equip & sets
  eMode: 'items', eSlot: new Set(), eRar: new Set(), eStat: new Set(), eSet: new Set(), eLine: new Set(), eSrc: new Set(), eWt: '', eLvMin: '', eLvMax: '', sortE: 'mon',
  // maps
  mpReg: '', mpKind: new Set(), sortMp: 'lv',
  // mats & life
  mtCat: 'all', sortMt: 'price',
  calc: (S && S.calc) || CALC0(),
});

fetch('data.json').then((r) => r.json()).then((j) => {
  D = j;
  D.monsters = D.monsters || [];
  D.maps = D.maps || [];
  D.materials = D.materials || [];
  D.life = D.life || { skills: [], dishes: [], crops: [], fish: [], ore: [], wood: [], refine: {} };
  S = fresh();

  D.R = Object.fromEntries(D.runes.map((r) => [r.k, r]));
  D.J = Object.fromEntries(D.jobs.map((x) => [x.id, x]));
  D.C = Object.fromEntries(D.cards.map((c) => [c.id, c]));
  D.M = Object.fromEntries(D.monsters.map((m) => [m.id, m]));
  D.MP = Object.fromEntries(D.maps.map((m) => [m.id, m]));
  D.MT = Object.fromEntries(D.materials.map((m) => [m.id, m]));

  // Map Thai/EN display name -> mapId for reverse lookup
  D.MAP_BY_NAME = {};
  for (const mp of D.maps) {
    if (mp.n.th) D.MAP_BY_NAME[mp.n.th] = mp.id;
    if (mp.n.en) D.MAP_BY_NAME[mp.n.en] = mp.id;
  }
  // Monster Thai/EN display name -> monId
  D.MON_BY_NAME = {};
  for (const m of D.monsters) {
    if (m.n.th) D.MON_BY_NAME[m.n.th] = m.id;
    if (m.n.en) D.MON_BY_NAME[m.n.en] = m.id;
  }

  D.fitBy = {};
  for (const s of D.skills) for (const k of s.fit) (D.fitBy[k] = D.fitBy[k] || []).push(s);

  const E = D.equip;
  E.I = Object.fromEntries(E.items.map((i) => [i.id, i]));
  E.S = Object.fromEntries(E.sets.map((s) => [s.id, s]));
  E.B = Object.fromEntries(E.bsets.map((b) => [b.boss, b]));

  // Build search text index for every entity
  for (const c of D.cards) {
    c._t = [c.id, c.mon.en, c.mon.th, c.art.en, c.art.th, c.d.en, c.d.th, ...c.maps.flatMap((m) => [m.en, m.th]), ...c.eff.flatMap((e) => e.txt.flatMap((x) => [x.en, x.th]))].join(' ').toLowerCase();
  }
  for (const r of D.runes) {
    r._t = [r.k, r.n.en, r.n.th, ...r.t.flatMap((x) => [x.en, x.th]), ...(r.drops || []).flatMap((d) => [d[3].en, d[3].th])].join(' ').toLowerCase();
  }
  for (const s of D.skills) {
    s.dmg = !!s.mul && !['buff', 'heal'].includes(s.type);
    const J = D.J[s.job] || { n: { en: '', th: '' } };
    s._t = [s.id, s.n.en, s.n.th, s.d.en, s.d.th, J.n.en, J.n.th].join(' ').toLowerCase();
  }
  for (const i of E.items) {
    const st = i.set && E.S[i.set], bs = i.bset && E.B[i.bset];
    i._t = [i.id, i.n.en, i.n.th, i.d.en, i.d.th, i.ab && i.ab.en, i.ab && i.ab.th, i.src.n && i.src.n.en, i.src.n && i.src.n.th, st && st.n.en, st && st.n.th, bs && bs.n.en, bs && bs.n.th, i.wt && E.wt[i.wt] && E.wt[i.wt].th, i.wt, ...(i.wsk || []).flatMap((w) => [w[0].en, w[0].th, w[1].en, w[1].th])].filter(Boolean).join(' ').toLowerCase();
  }
  for (const s of E.sets) {
    s._t = [s.id, s.n.en, s.n.th, s.b2.en, s.b2.th, s.b3.en, s.b3.th, s.pas.en, s.pas.th, ...s.pcs.flatMap((p) => { const i = E.I[p]; return i ? [i.n.en, i.n.th, i._t] : []; })].join(' ').toLowerCase();
  }
  for (const b of E.bsets) {
    b._t = [b.boss, b.n.en, b.n.th, b.bn.en, b.bn.th, b.text.en, b.text.th].join(' ').toLowerCase();
  }
  for (const m of D.monsters) {
    const c = D.C[m.id];
    const rn = m.rune && D.R[m.rune[0]];
    const dropNames = (m.drops || []).flatMap(([iid]) => {
      const it = E.I[iid];
      if (!it) return [];
      const st = it.set && E.S[it.set];
      return [it.n.en, it.n.th, st && st.n.en, st && st.n.th];
    });
    const matNames = (m.mats || []).flatMap(([mid]) => {
      const mt = D.MT[mid];
      return mt ? [mt.n.en, mt.n.th] : [];
    });
    m._hasSetDrop = (m.drops || []).some(([iid]) => E.I[iid] && (E.I[iid].set || E.I[iid].bset));
    m._hasRareMat = (m.mats || []).some(([mid]) => D.MT[mid] && D.MT[mid].rare);
    m._t = [
      m.id, m.n.en, m.n.th, `lv${m.lv}`, `lv ${m.lv}`,
      m.el, D.meta.el[m.el]?.th, m.race, D.meta.race[m.race]?.th,
      ...m.maps.flatMap((mp) => [mp.en, mp.th]),
      ...(c ? [c.art.en, c.art.th, c.d.en, c.d.th] : []),
      ...(rn ? [rn.n.en, rn.n.th] : []),
      ...dropNames, ...matNames
    ].filter(Boolean).join(' ').toLowerCase();
  }
  for (const mp of D.maps) {
    const monNames = (mp.mons || []).flatMap((mid) => {
      const m = D.M[mid];
      return m ? [m.n.en, m.n.th, m._t] : [];
    });
    const lvM = /(\d+)/.exec(mp.lv || '');
    mp._lvNum = lvM ? +lvM[1] : (mp.mons && mp.mons.length && D.M[mp.mons[0]] ? D.M[mp.mons[0]].lv : 1);
    mp._t = [mp.id, mp.n.en, mp.n.th, mp.lv, D.meta.reg[mp.region]?.th, D.meta.reg[mp.region]?.en, ...(mp.zones || []).flatMap((z) => [z.en, z.th]), ...monNames].filter(Boolean).join(' ').toLowerCase();
  }
  for (const mt of D.materials) {
    mt._t = [mt.id, mt.n.en, mt.n.th, mt.d.en, mt.d.th, mt.from && mt.from.en, mt.from && mt.from.th, ...(mt.drops || []).flatMap((d) => [d[3].en, d[3].th])].filter(Boolean).join(' ').toLowerCase();
  }

  wire();
  updatePinUI();
  render();
});

function wire() {
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (!b) return;
    switchView(b.dataset.view);
  });
  document.getElementById('omni-strip').addEventListener('click', (e) => {
    const b = e.target.closest('[data-oview]');
    if (!b) return;
    switchView(b.dataset.oview);
  });
  document.getElementById('lang').addEventListener('click', (e) => {
    const b = e.target.closest('[data-l]');
    if (!b) return;
    LANG = b.dataset.l;
    localStorage.setItem('lang', LANG);
    render();
  });
  const qIn = document.getElementById('q');
  const qClr = document.getElementById('q-clear');
  qIn.addEventListener('input', (e) => {
    S.q = e.target.value;
    qClr.classList.toggle('show', Boolean(S.q));
    draw();
    drawOmniStrip();
  });
  qClr.addEventListener('click', () => {
    S.q = '';
    qIn.value = '';
    qClr.classList.remove('show');
    draw();
    drawOmniStrip();
    qIn.focus();
  });
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      qIn.focus();
      qIn.select();
    } else if (e.key === 'Escape') {
      closeInspector();
    }
  });
  document.getElementById('sort').addEventListener('change', (e) => {
    S[sortKey()] = e.target.value;
    draw();
  });
  document.getElementById('reset').addEventListener('click', () => {
    S = fresh();
    PIN_ONLY = false;
    qIn.value = '';
    qClr.classList.remove('show');
    updatePinUI();
    render();
  });
  document.getElementById('btn-pinned-only').addEventListener('click', () => {
    PIN_ONLY = !PIN_ONLY;
    updatePinUI();
    draw();
  });

  const side = document.getElementById('side');
  side.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.block) toggleBlock(b.dataset.block);
    else if (b.dataset.unblock) { BLOCK.clear(); localStorage.setItem('blocked', '[]'); }
    else if (b.dataset.mode) S.mode = b.dataset.mode;
    else if (b.dataset.emode) {
      if (b.dataset.emode === 'sets') { switchView('sets'); return; }
      S.eMode = b.dataset.emode;
    } else if (b.dataset.mtcat) {
      S.mtCat = b.dataset.mtcat;
    } else if (b.parentElement.dataset.set) {
      const set = S[b.parentElement.dataset.set];
      const v = b.dataset.v;
      set.has(v) ? set.delete(v) : set.add(v);
    }
    drawSide();
    draw();
  });
  side.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.dataset.sel != null) { S[t.dataset.sel] = t.value; drawSide(); draw(); }
  });
  side.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.num) { S[t.dataset.num] = t.value; draw(); }
  });

  document.getElementById('grid').addEventListener('change', (ev) => {
    const el = ev.target.closest('[data-hits]');
    if (!el) return;
    const s = D.skills.find((x) => x.id === el.dataset.hits), v = Math.max(1, Math.round(+el.value || 1));
    if (v === s.hits) delete HITS[s.id]; else HITS[s.id] = v;
    localStorage.setItem('hits', JSON.stringify(HITS));
    draw();
  });

  // Global delegated click handler for Pins, Rune Blocking, Set links & Cross-Entity Navigation (`data-go`)
  document.addEventListener('click', (ev) => {
    const pinB = ev.target.closest('[data-pin]');
    if (pinB) {
      ev.preventDefault();
      ev.stopPropagation();
      togglePin(pinB.dataset.pin);
      pinB.classList.toggle('on', PINNED.has(pinB.dataset.pin));
      pinB.textContent = PINNED.has(pinB.dataset.pin) ? '⭐' : '☆';
      if (PIN_ONLY) draw();
      return;
    }
    const blkB = ev.target.closest('#grid button[data-block]');
    if (blkB) {
      ev.preventDefault();
      toggleBlock(blkB.dataset.block);
      const open = [...document.querySelectorAll('#grid details[open]')].map((d) => d.closest('.c')?.dataset?.sid).filter(Boolean);
      drawSide();
      draw();
      for (const id of open) {
        const d = document.querySelector(`#grid .c[data-sid="${id}"] details`);
        if (d) d.open = true;
      }
      return;
    }
    const goSet = ev.target.closest('[data-goset]');
    if (goSet) {
      ev.preventDefault();
      switchView('sets');
      S.q = goSet.dataset.goset;
      document.getElementById('q').value = S.q;
      document.getElementById('q-clear').classList.add('show');
      drawSide();
      draw();
      scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    const goEl = ev.target.closest('[data-go]');
    if (goEl) {
      ev.preventDefault();
      const [kind, id] = goEl.dataset.go.split(':');
      openInspector(kind, id, true);
      return;
    }
  });

  // Inspector controls
  document.getElementById('inspector-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'inspector-backdrop') closeInspector();
  });
  document.getElementById('insp-close').addEventListener('click', closeInspector);
  document.getElementById('insp-back').addEventListener('click', () => {
    if (NAV_HISTORY.length > 1) {
      NAV_HISTORY.pop();
      const prev = NAV_HISTORY[NAV_HISTORY.length - 1];
      openInspector(prev.kind, prev.id, false);
    }
  });
  document.getElementById('insp-jump-tab').addEventListener('click', () => {
    const cur = NAV_HISTORY[NAV_HISTORY.length - 1];
    if (!cur) return;
    closeInspector();
    jumpToEntityInTab(cur.kind, cur.id);
  });

  const cb = document.getElementById('calcbar');
  cb.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-c]');
    if (!b) return;
    const [k, v] = b.dataset.c.split('=');
    S.calc[k] = k === 'night' || k === 'near' ? v === '1' : isNaN(+v) ? v : +v;
    drawCalc();
    draw();
  });
  cb.addEventListener('input', (ev) => {
    const t = ev.target;
    if (!t.dataset.ci) return;
    S.calc[t.dataset.ci] = t.type === 'range' ? +t.value / 100 : Math.max(2, +t.value || 2);
    if (t.type === 'range') t.nextElementSibling.textContent = pctS(+t.value / 100);
    draw();
  });
}

function switchView(v) {
  if (!VALID_VIEWS.includes(v)) return;
  VIEW = v;
  if (v === 'sets') S.eMode = 'sets';
  else if (v === 'equip') S.eMode = 'items';
  localStorage.setItem('view', VIEW);
  render();
}

const sortKey = () => ({
  monsters: 'sortM', equip: 'sortE', sets: 'sortE', cards: 'sortC', runes: 'sortR', skills: 'sortS', maps: 'sortMp', mats: 'sortMt'
}[VIEW]);

function render() {
  document.documentElement.lang = LANG;
  const countsByView = {
    monsters: D.monsters.length,
    equip: D.equip.items.length,
    sets: D.equip.sets.length + D.equip.bsets.length,
    cards: D.cards.length,
    runes: D.runes.length,
    skills: D.skills.length,
    maps: D.maps.length,
    mats: D.materials.length
  };
  document.querySelectorAll('#tabs [data-view]').forEach((b) => {
    const k = b.dataset.view;
    b.innerHTML = `<span>${T()[k]}</span><span class="tab-badge">${countsByView[k] || 0}</span>`;
    b.classList.toggle('on', k === VIEW);
  });
  document.querySelectorAll('#lang [data-l]').forEach((b) => b.classList.toggle('on', b.dataset.l === LANG));
  const qPlaceholderKey = {
    monsters: 'qMonsters', equip: 'qEquip', sets: 'qSets', cards: 'qCards', runes: 'qRunes', skills: 'qSkills', maps: 'qMaps', mats: 'qMats'
  }[VIEW];
  document.getElementById('q').placeholder = T()[qPlaceholderKey] || '';
  document.getElementById('reset').textContent = T().reset;
  document.querySelector('#sortL span').textContent = T().sort;
  const opts = {
    monsters: [['lv', 'sLv'], ['lvd', 'sLvd'], ['exp', 'sExp'], ['jexp', 'sJexp'], ['hp', 'sHp'], ['drops', 'sDrops'], ['n', 'sName']],
    cards: [['val', 'sVal'], ['lv', 'sLv'], ['lvd', 'sLvd'], ['cd', 'sCd'], ['n', 'sName']],
    runes: [['gain', 'sGain'], ['mon', 'sMon'], ['n', 'sName']],
    skills: [['best', 'sBest'], ['job', 'sJob'], ['n', 'sName']],
    equip: [['mon', 'sMon'], ['lv', 'sLv'], ['lvd', 'sLvd'], ['stat', 'sStat'], ['atk', 'sAtk'], ['n', 'sName']],
    sets: [['mon', 'sMon'], ['lv', 'sLv'], ['lvd', 'sLvd'], ['stat', 'sStat'], ['n', 'sName']],
    maps: [['lv', 'sLv'], ['lvd', 'sLvd'], ['n', 'sName']],
    mats: [['price', 'sPrice'], ['mon', 'sMon'], ['n', 'sName']]
  }[VIEW];
  const selEl = document.getElementById('sort');
  selEl.innerHTML = opts.map(([v, k]) => `<option value="${v}">${T()[k]}</option>`).join('');
  selEl.value = S[sortKey()];
  document.getElementById('meta').textContent = T().meta(
    D.monsters.length, D.equip.items.length, D.equip.sets.length + D.equip.bsets.length,
    D.cards.length, D.runes.length, D.skills.length, D.maps.length
  );
  document.getElementById('help').innerHTML = `<div class="help">${esc(T().help)}</div>`;
  drawCalc();
  drawSide();
  draw();
  drawOmniStrip();
}

function draw() {
  ({
    monsters: drawMonsters,
    equip: drawEquip,
    sets: drawSetsView,
    cards: drawCards,
    runes: drawRunes,
    skills: drawSkills,
    maps: drawMaps,
    mats: drawMats
  })[VIEW]();
}

function drawOmniStrip() {
  const strip = document.getElementById('omni-strip');
  if (!S.q || !S.q.trim()) {
    strip.classList.remove('show');
    strip.innerHTML = '';
    return;
  }
  const hits = [
    ['monsters', T().monsters, D.monsters.filter((x) => qOk(x._t)).length],
    ['equip', T().equip, D.equip.items.filter((x) => qOk(x._t)).length],
    ['sets', T().sets, D.equip.sets.filter((x) => qOk(x._t)).length + D.equip.bsets.filter((x) => qOk(x._t)).length],
    ['cards', T().cards, D.cards.filter((x) => qOk(x._t)).length],
    ['runes', T().runes, D.runes.filter((x) => qOk(x._t)).length],
    ['skills', T().skills, D.skills.filter((x) => qOk(x._t)).length],
    ['maps', T().maps, D.maps.filter((x) => qOk(x._t)).length],
    ['mats', T().mats, D.materials.filter((x) => qOk(x._t)).length]
  ].filter(([, , n]) => n > 0);
  if (!hits.length) {
    strip.classList.remove('show');
    return;
  }
  strip.classList.add('show');
  strip.innerHTML = `<b style="color:var(--acc);">⚡ พบ "${esc(S.q)}" ในหมวดหมู่:</b> ` +
    hits.map(([k, lbl, n]) => `<button type="button" class="chip ${k === VIEW ? 'on' : ''}" data-oview="${k}">${lbl} <b>(${n})</b></button>`).join('');
}

// ---------------- shared helpers
function counts(list, f) { const m = {}; for (const c of list) for (const v of new Set(f(c))) m[v] = (m[v] || 0) + 1; return m; }
function chips(id, map, set, label) {
  return `<div class="chips" data-set="${id}">` + Object.keys(map).map((k) => `<button class="chip ${set.has(k) ? 'on' : ''}" data-v="${esc(k)}">${esc(label(k))}<small>${map[k]}</small></button>`).join('') + '</div>';
}
function sel(id, opts, cur, all) {
  return `<select data-sel="${id}"><option value="">${esc(all)}</option>` + opts.map(([v, t]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(t)}</option>`).join('') + '</select>';
}
function setCount(a, b, u) { document.getElementById('count').textContent = T().count(a, b, T()[u]); }
const words = () => S.q.toLowerCase().split(/\s+/).filter(Boolean);
const qOk = (t) => words().every((w) => (t || '').includes(w));
const elName = (k) => (k ? L(D.meta.el[k]) || k : '');
const subName = (s) => (LANG === 'th' ? (D.meta.el[s.toLowerCase()] ? D.meta.el[s.toLowerCase()].th : STATUS_TH[s] || s) : s);
function jobOpts() {
  return D.jobs.filter((j) => D.skills.some((s) => s.job === j.id)).sort((a, b) => a.tier - b.tier || L(a.n).localeCompare(L(b.n))).map((j) => [j.id, `${'·'.repeat(j.tier)} ${L(j.n)}`]);
}

// Entity Pill Builders (Hoverable + Clickable)
function itemPillHtml(iid, rate) {
  const it = D.equip.I[iid];
  if (!it) return '';
  const setBadge = it.set ? ' <span style="color:#a78bfa;font-size:10px;">[เซ็ต]</span>' : (it.bset ? ' <span style="color:#f87171;font-size:10px;">[เซ็ตบอส]</span>' : '');
  return `<a href="#" class="elink rar-${it.r || 'common'}" data-go="item:${esc(iid)}" data-tip="item:${esc(iid)}">${ico(it.ic, 20)}<span>${esc(L(it.n))}${setBadge}</span>${rate != null ? `<span class="rate">${fmtRate(rate)}</span>` : ''}</a>`;
}
function monPillHtml(mid, rate, customLv) {
  const m = D.M[mid];
  if (!m) return `<span class="elink">💀 ${esc(mid)}</span>`;
  return `<a href="#" class="elink" data-go="mon:${esc(mid)}" data-tip="mon:${esc(mid)}">💀 <span>${esc(L(m.n))} <small style="color:var(--mut)">Lv.${customLv || m.lv}</small></span>${rate != null ? `<span class="rate">${fmtRate(rate)}</span>` : ''}</a>`;
}
function mapPillHtml(mapObjOrId) {
  const mid = typeof mapObjOrId === 'string' ? mapObjOrId : (D.MAP_BY_NAME[L(mapObjOrId)] || D.MAP_BY_NAME[mapObjOrId?.en] || '');
  const mp = mid && D.MP[mid];
  const label = mp ? L(mp.n) : L(mapObjOrId);
  if (!mp) return `<span class="elink">📍 ${esc(label)}</span>`;
  return `<a href="#" class="elink" data-go="map:${esc(mp.id)}" data-tip="map:${esc(mp.id)}">📍 <span>${esc(label)}</span>${mp.lv ? `<small style="color:var(--mut)">${esc(mp.lv)}</small>` : ''}</a>`;
}
function matPillHtml(matId, rate) {

function mapCardHtml(mp) {
  const mons = (mp.mons || []).map((mid) => D.M[mid]).filter(Boolean);
  const monPills = mons.map((m) => {
    const mlvArr = mp.mlv && mp.mlv[m.id];
    const lvTxt = Array.isArray(mlvArr) ? `${mlvArr[0]}–${mlvArr[1]}` : m.lv;
    return monPillHtml(m.id, null, lvTxt);
  }).join('');
  // Collect notable equipment & runes dropped on this map
  const mapEquipIds = [...new Set(mons.flatMap((m) => (m.drops || []).map((d) => d[0])))];
  const mapRunes = [...new Set(mons.map((m) => m.rune && m.rune[0]).filter(Boolean))];
  const equipPills = mapEquipIds.slice(0, 8).map((iid) => itemPillHtml(iid)).join('') +
    (mapEquipIds.length > 8 ? `<span class="s"> +${mapEquipIds.length - 8} ชิ้น</span>` : '');
  const runePills = mapRunes.map((rk) => runePillHtml(rk)).join('');
  return `<div class="c" data-entity="map:${esc(mp.id)}">
    <div class="top">
      <div class="brand-badge" style="width:48px;height:48px;font-size:22px;">🗺️</div>
      <div style="flex:1;min-width:0;">
        <div class="n"><a href="#" data-go="map:${esc(mp.id)}" style="color:inherit;text-decoration:none;">${esc(L(mp.n))}</a> <span class="s">(${esc(mp.id)})</span></div>
        <div>
          ${mp.lv ? `<span class="tag" style="background:#0284c7">${esc(mp.lv)}</span>` : ''}
          ${mp.region && D.meta.reg[mp.region] ? `<span class="tag o">${esc(L(D.meta.reg[mp.region]))}</span>` : ''}
          <span class="tag o">${esc(T().mapKinds[mp.secret ? 'secret' : mp.kind] || mp.kind)}</span>
        </div>
      </div>
      ${pinBtnHtml('map:' + mp.id)}
    </div>
    ${mp.zones && mp.zones.length ? `<div class="s">🧭 <b>โซนย่อยในแมพ:</b> ${mp.zones.map((z) => esc(L(z))).join(' · ')}</div>` : ''}
    <div class="drop-sec">

    </div>
    ${(equipPills || runePills) ? `<div class="drop-sec"><div class="drop-lbl">🎁 ของดรอปเด่นในแมพนี้:</div><div class="drop-pills">${runePills}${equipPills}</div></div>` : ''}
  </div>`;
}

(function () {
  const tip = () => document.getElementById('tip');
  let cur = null;
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip],[data-rk]');
    if (!el) {
      if (cur) { tip().style.display = 'none'; cur = null; }
      return;
    }
    if (el !== cur) {
      cur = el;
      const spec = el.dataset.tip || ('rune:' + el.dataset.rk);
      const [kind, id] = spec.split(':');
      const html = buildEntityTipHtml(kind, id);
      if (!html) { tip().style.display = 'none'; return; }
      tip().innerHTML = html;
      tip().style.display = 'block';
    }
  });
  document.addEventListener('mousemove', (e) => {
    if (!cur) return;
    const T0 = tip(), w = T0.offsetWidth, h = T0.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 16;
    if (x + w > innerWidth - 10) x = e.clientX - w - 16;
    if (y + h > innerHeight - 10) y = Math.max(10, e.clientY - h - 16);
    T0.style.left = x + 'px';
    T0.style.top = y + 'px';
  });
  addEventListener('scroll', () => {
    if (cur) { tip().style.display = 'none'; cur = null; }
  }, true);
})();

  if (kind === 'set' && D.equip.S[id]) return `🧩 ${L(D.equip.S[id].n)}`;
  if (kind === 'bset' && D.equip.B[id]) return `👑 ${L(D.equip.B[id].n)}`;
  if (kind === 'card' && D.C[id]) return `🃏 การ์ด${L(D.C[id].mon)}`;
  if (kind === 'rune' && D.R[id]) return `💎 ${L(D.R[id].n)}`;
  if (kind === 'skill') { const s = D.skills.find((x) => x.id === id); return s ? `⚔️ ${L(s.n)}` : id; }
  if (kind === 'map' && D.MP[id]) return `🗺️ ${L(D.MP[id].n)}`;
  if (kind === 'mat' && D.MT[id]) return `🧪 ${L(D.MT[id].n)}`;
  return `${kind}:${id}`;
}

function openInspector(kind, id, pushHistory = true) {
  document.getElementById('tip').style.display = 'none';
  if (pushHistory) {
    const last = NAV_HISTORY[NAV_HISTORY.length - 1];
    if (!last || last.kind !== kind || last.id !== id) {
      NAV_HISTORY.push({ kind, id, title: getEntityTitle(kind, id) });
      if (NAV_HISTORY.length > 10) NAV_HISTORY.shift();
    }
  }
  let bodyHtml = '';
  if (kind === 'mon' && D.M[id]) bodyHtml = monsterHtml(D.M[id]);
  else if (kind === 'item' && D.equip.I[id]) {
    const it = D.equip.I[id];
    bodyHtml = itemHtml(it);
    if (it.set && D.equip.S[it.set]) bodyHtml += `<div style="margin-top:12px;">${setHtml(D.equip.S[it.set])}</div>`;
    if (it.bset && D.equip.B[it.bset]) bodyHtml += `<div style="margin-top:12px;">${bsetHtml(D.equip.B[it.bset])}</div>`;
  } else if (kind === 'set' && D.equip.S[id]) bodyHtml = setHtml(D.equip.S[id]);
  else if (kind === 'bset' && D.equip.B[id]) bodyHtml = bsetHtml(D.equip.B[id]);
  else if (kind === 'card' && D.C[id]) bodyHtml = cardHtml(D.C[id]);
  else if (kind === 'rune' && D.R[id]) bodyHtml = runeHtml({ r: D.R[id], o: eff(D.R[id]) });
  else if (kind === 'skill') {
    const sk = D.skills.find((x) => x.id === id);
    if (sk) bodyHtml = skillHtml({ s: sk, b: bestCombos(sk) });
  } else if (kind === 'map' && D.MP[id]) bodyHtml = mapCardHtml(D.MP[id]);
  else if (kind === 'mat' && D.MT[id]) {
    const m = D.MT[id];
    const drops = (m.drops || []).map(([mid, rate, lv]) => monPillHtml(mid, rate, lv)).join('');
    bodyHtml = `<div class="c${m.rare ? ' rar-legend' : ''}">
      <div class="top">${ico(m.ic, 52)}<div><div class="n">${esc(L(m.n))}</div><div class="s">ราคาขาย NPC: <b style="color:#fbbf24">${m.p}g</b> · ${esc(m.id)}</div></div></div>
      <div class="d">${esc(L(m.d))}</div>
      <div class="drop-sec"><div class="drop-lbl">💀 ดรอปจากมอนสเตอร์ (${(m.drops || []).length}):</div><div class="drop-pills">${drops || '<span class="s">–</span>'}</div></div>
    </div>`;
  }
  if (!bodyHtml) return;
  document.getElementById('insp-body').innerHTML = bodyHtml;
  const backBtn = document.getElementById('insp-back');
  backBtn.style.display = NAV_HISTORY.length > 1 ? 'inline-flex' : 'none';
  document.getElementById('insp-crumb').innerHTML = NAV_HISTORY.map((h, idx) =>
    `<span class="crumb-item" onclick="jumpHistoryIdx(${idx})">${esc(h.title)}</span>`
  ).join(' <span style="opacity:.5">➔</span> ');
  document.getElementById('inspector-backdrop').classList.add('open');
  renderCrumbBar();
}

window.jumpHistoryIdx = function (idx) {
  if (idx < 0 || idx >= NAV_HISTORY.length) return;
  NAV_HISTORY = NAV_HISTORY.slice(0, idx + 1);
  const cur = NAV_HISTORY[NAV_HISTORY.length - 1];
  openInspector(cur.kind, cur.id, false);
};

function closeInspector() {
  document.getElementById('inspector-backdrop').classList.remove('open');
}

function renderCrumbBar() {
  const bar = document.getElementById('crumb-bar');
  if (!NAV_HISTORY.length) {
    bar.classList.remove('show');
    return;
  }
  bar.classList.add('show');
  bar.innerHTML = `<span style="color:var(--mut);font-weight:700;">🕓 ประวัติการเปิดดูล่าสุด:</span>` +
    NAV_HISTORY.map((h) => `<button type="button" class="crumb-item" data-go="${esc(h.kind + ':' + h.id)}">${esc(h.title)}</button>`).join('');
}

function jumpToEntityInTab(kind, id) {
  const tabMap = { mon: 'monsters', item: 'equip', set: 'sets', bset: 'sets', card: 'cards', rune: 'runes', skill: 'skills', map: 'maps', mat: 'mats' };
  const targetView = tabMap[kind] || 'monsters';
  S = fresh();
  PIN_ONLY = false;
  updatePinUI();
  let queryName = '';
  if (kind === 'mon' && D.M[id]) queryName = L(D.M[id].n);
  else if (kind === 'item' && D.equip.I[id]) queryName = L(D.equip.I[id].n);
  else if (kind === 'set' && D.equip.S[id]) queryName = L(D.equip.S[id].n);
  else if (kind === 'bset' && D.equip.B[id]) queryName = L(D.equip.B[id].n);
  else if (kind === 'card' && D.C[id]) queryName = L(D.C[id].mon);
  else if (kind === 'rune' && D.R[id]) queryName = L(D.R[id].n);
  else if (kind === 'skill') { const s = D.skills.find((x) => x.id === id); if (s) queryName = L(s.n); }
  else if (kind === 'map' && D.MP[id]) queryName = L(D.MP[id].n);
  else if (kind === 'mat' && D.MT[id]) queryName = L(D.MT[id].n);
  S.q = queryName;
  document.getElementById('q').value = S.q;
  document.getElementById('q-clear').classList.toggle('show', Boolean(S.q));
  switchView(targetView);
  setTimeout(() => {
    const card = document.querySelector(`[data-entity="${kind}:${id}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('flash-highlight');
    }
  }, 60);
}

function drawSide() {
  document.getElementById('side').innerHTML = ({
    monsters: drawSideMonsters,
    equip: drawSideEquip,
    sets: drawSideEquip,
    cards: drawSideCards,
    runes: drawSideRunes,
    skills: drawSideSkills,
    maps: drawSideMaps,
    mats: drawSideMats
  })[VIEW]();
}
</script>
</body>
